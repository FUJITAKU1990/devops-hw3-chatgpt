name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Prepare env
        run: |
          cp -n .env.example .env
          ./scripts/generate-env-secrets .env

      # Docker image builds and the host-side install/build/type-check chain
      # are independent of each other (each Dockerfile installs its own
      # dependencies inside its build context), so run them concurrently
      # instead of paying for both in sequence. `docker compose build` alone
      # was consistently the single largest cost in this job (~80s of a
      # ~155s total), so overlapping it with everything else is the highest-
      # value speed-up available without weakening any check. Every
      # concurrent step's exit status is checked explicitly (relying on
      # `set -e` alone does not catch a failure in a backgrounded command).
      - name: Build Docker images and application concurrently
        run: |
          docker compose config -q &
          COMPOSE_CONFIG_PID=$!

          docker build -f docker/base.Dockerfile -t tartan-base:local . &
          BASE_PID=$!

          npm ci
          npm run build:database
          npm run build:mail

          npx tsc --noEmit -p services/api-gateway/tsconfig.json &
          TC_GATEWAY=$!
          npx tsc --noEmit -p services/auth-service/tsconfig.json &
          TC_AUTH=$!
          npx tsc --noEmit -p services/ticket-service/tsconfig.json &
          TC_TICKET=$!
          npm run build -w frontend &
          FRONTEND=$!

          FAIL=0
          wait "$COMPOSE_CONFIG_PID" || { echo "FAIL: docker compose config validation"; FAIL=1; }
          wait "$BASE_PID" || { echo "FAIL: base image build"; FAIL=1; }

          BUILD_PID=""
          if [ "$FAIL" -eq 0 ]; then
            docker compose build &
            BUILD_PID=$!
          fi

          wait "$TC_GATEWAY" || { echo "FAIL: api-gateway type-check"; FAIL=1; }
          wait "$TC_AUTH" || { echo "FAIL: auth-service type-check"; FAIL=1; }
          wait "$TC_TICKET" || { echo "FAIL: ticket-service type-check"; FAIL=1; }
          wait "$FRONTEND" || { echo "FAIL: frontend build"; FAIL=1; }
          if [ -n "$BUILD_PID" ]; then
            wait "$BUILD_PID" || { echo "FAIL: docker compose build"; FAIL=1; }
          fi
          exit "$FAIL"

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for application readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8636/api/events > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run ./scripts/check
        env:
          TARTAN_BASE_URL: http://localhost:8636
        run: |
          set -a
          source .env
          set +a
          ./scripts/check

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=500

      - name: Tear down
        if: always()
        run: docker compose down -v --timeout 1
  
  secrets-scan:
    runs-on: self-hosted
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          cd /tmp
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$ASSET" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$ASSET"
          curl -sSL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "$ASSET" checksums.txt | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "range=${{ github.sha }}~1..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "range=${BEFORE}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run gitleaks over the commit range
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="${{ steps.range.outputs.range }}" \
            --redact --exit-code 1
  
  guardrails-check:
    runs-on: self-hosted
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Run secret guardrails check
        run: ./scripts/check-secret-guardrails

  ci-integrity-check:
    runs-on: self-hosted
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI integrity check
        run: ./scripts/check-ci-integrity

  bonus-hardening-check:
    runs-on: self-hosted
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bonus hardening check
        run: ./scripts/check-bonus-hardening
