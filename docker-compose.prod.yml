# Production-only Compose override for HW3.
# Student-controlled runtime components are pulled by immutable registry digest.
# This file must be used together with docker-compose.yml and a release record
# exported into the environment. No student-controlled image is rebuilt on the VM.
services:
  migrator:
    image: ${MIGRATOR_IMAGE:?MIGRATOR_IMAGE must be an immutable release digest}
    build: !reset null

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:?AUTH_SERVICE_IMAGE must be an immutable release digest}
    build: !reset null

  ticket-service:
    image: ${TICKET_SERVICE_IMAGE:?TICKET_SERVICE_IMAGE must be an immutable release digest}
    build: !reset null

  api-gateway:
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE must be an immutable release digest}
    build: !reset null

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable release digest}
    build: !reset null
    ports: !override
      - "443:80"
